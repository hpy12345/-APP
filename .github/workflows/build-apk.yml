name: Build APK

# 用途：本机没装 Flutter / Android SDK 时，把项目推到 GitHub，
# 由 Actions 免费构建出可安装的 APK，从 Artifacts 下载即可。
#
# 触发方式：
#   - 手动：仓库页面 → Actions → Build APK → Run workflow
#   - 自动：推送到 main 或 master 分支

on:
  workflow_dispatch:
  push:
    branches: [main, master]

# 可选签名密钥（不配也能出包，只是回退 debug 签名）。
# 配置位置：仓库 Settings → Secrets and variables → Actions → New repository secret
#   KEYSTORE_BASE64     jks 文件的 base64
#                       PowerShell: [Convert]::ToBase64String([IO.File]::ReadAllBytes("ledger-release.jks"))
#   KEYSTORE_PASSWORD   库密码
#   KEY_PASSWORD        密钥密码
#   KEY_ALIAS           密钥别名（如 ledger）
# 四个都配齐才启用正式签名。
env:
  KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
  KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
  KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
  KEY_ALIAS: ${{ secrets.KEY_ALIAS }}

jobs:
  build:
    # 固定到 24.04：ubuntu-latest 会在 2026-10-19 迁到 Ubuntu 26，
    # 固定版本可避免"某天突然换系统"导致的构建漂移。
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # JDK 17：AGP 8.7.3 的硬性要求（同时提供 keytool）
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # ⚠️ 关键一步，别删。
      # Windows 上 git 的 core.fileMode=false，不跟踪文件权限位，所以
      # gradlew 提交时是 100644（不可执行）。Linux runner 检出后调 ./gradlew
      # 会直接 Permission denied → "Process completed with exit code 1"。
      # 仓库里的 index 已修正为 100755；这里再兜一道，防止权限位再次丢失。
      - name: Ensure gradlew is executable
        run: chmod +x android/gradlew

      # NDK 必须与插件要求**精确相等**，不能用"更高就行"的思路。
      # Flutter 的 Gradle 插件做的是全等比较：
      #     if (maxPluginNdkVersion != projectNdkVersion) { 报错 }
      # （见 flutter_tools/gradle/src/main/groovy/flutter.groovy）
      # 所以只能用 27.0.12077973 —— runner 预装的 27.3.x 同样会判失败。
      # runner 上没有 27.0.12077973，这里显式安装，避免依赖 AGP 静默自动下载
      # （那种失败只会抛一句 "Gradle build failed to produce an .apk file"，很难定位）。
      - name: Install Android NDK 27.0.12077973
        shell: bash
        run: |
          set -o pipefail
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" --install "ndk;27.0.12077973" 2>&1 | tail -20

      # 有密钥则落盘 android/key.properties + android/app/ledger-release.jks，
      # build.gradle.kts 检测到 key.properties 即自动启用 release 签名。
      - name: Configure release signing (optional)
        if: env.KEYSTORE_BASE64 != ''
        shell: bash
        run: |
          set -euo pipefail
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/ledger-release.jks
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=ledger-release.jks
          EOF
          echo "已启用 release 签名"

      - name: Warn on debug signing fallback
        if: env.KEYSTORE_BASE64 == ''
        run: echo "::warning::未配置 KEYSTORE_BASE64，本次产物为 debug 签名（可安装；但换签名后需先卸载）"

      # Flutter 版本与工程的 Gradle 8.9 / AGP 8.7.3 / Kotlin 2.0.21 对齐。
      # 若要升到更新的 stable，请同步把 android/app/build.gradle.kts 的
      # compileSdk 提到新插件要求的级别（多数插件从 compileSdk 36 起）。
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.27.4"
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      # 静态检查只做提示，不阻断出包（避免小警告卡住安装包）
      - name: Analyze (non-blocking)
        run: flutter analyze
        continue-on-error: true

      # ── 构建 ───────────────────────────────────────────────
      # 只出通用包（任何机型可装）。不再跑 --split-per-abi：
      # 它对体积有帮助，但会让构建时间翻倍、失败面翻倍；个人直装用不上。
      # 需要时本地执行：flutter build apk --release --split-per-abi
      #
      # continue-on-error：失败也先往下走，交给下面的「归位 + 诊断」步骤
      # 暴露真实原因，并尽量把已经生成的 APK 抢救出来。
      - name: Build universal APK
        id: build
        shell: bash
        continue-on-error: true
        run: |
          set -o pipefail
          flutter build apk --release 2>&1 | tee "$RUNNER_TEMP/build.log"

      # 为什么需要这一步：
      # Flutter 的 Gradle 插件是用
      #     assembleTask.doLast { project.copy { from <AGP 产物目录>/<outputFileName> ... } }
      # 把 APK 拷到 flutter-apk/ 的；而 Gradle 的 copy 在**源文件不存在时静默跳过、不报错**。
      # 一旦构建目录配置有问题（例如 android/build.gradle.kts 漏了
      # rootProject.layout.buildDirectory 重定向），就会出现
      # 「Gradle 成功退出、日志零报错、但 flutter build 报
      #   Gradle build failed to produce an .apk file」这种极难定位的现象。
      # 这里把两处可能的产物目录都扫一遍并归位，同时把目录结构暴露成 annotation。
      - name: Recover APK & diagnose
        if: steps.build.outcome == 'failure'
        shell: bash
        run: |
          set +e
          mkdir -p build/app/outputs/flutter-apk
          {
            echo "build.log 行数: $(wc -l < "$RUNNER_TEMP/build.log")"
            for d in build/app/outputs android/app/build/outputs; do
              echo "--- 目录树 $d ---"
              find "$d" -maxdepth 4 2>/dev/null | head -30
              echo "--- $d 里的 apk ---"
              find "$d" -type f -name '*.apk' 2>/dev/null | head -10
            done
            echo "--- flutter-apk 目录（归位前）---"
            ls -la build/app/outputs/flutter-apk 2>&1 | head -10
          } > "$RUNNER_TEMP/diag.txt" 2>&1
          # -n 不覆盖已有文件；只扫 outputs 目录，避免把 intermediates 里的半成品拷进来
          for d in build/app/outputs android/app/build/outputs; do
            [ -d "$d" ] || continue
            find "$d" -type f -name '*.apk' -exec cp -n {} build/app/outputs/flutter-apk/ \; >> "$RUNNER_TEMP/diag.txt" 2>&1
          done
          echo "--- 归位后 flutter-apk ---" >> "$RUNNER_TEMP/diag.txt"
          ls -la build/app/outputs/flutter-apk >> "$RUNNER_TEMP/diag.txt" 2>&1
          head -c 30000 "$RUNNER_TEMP/diag.txt" | tr -d '\r' | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}' > "$RUNNER_TEMP/ann.txt"
          echo "::warning title=构建诊断::$(cat "$RUNNER_TEMP/ann.txt")"

      - name: Verify APK exists
        shell: bash
        run: |
          ls -la build/app/outputs/flutter-apk/ || true
          if [ ! -f build/app/outputs/flutter-apk/app-release.apk ]; then
            echo "::error::没有产出 app-release.apk —— 见上一条『构建诊断』注解里的目录结构"
            exit 1
          fi
          du -h build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: ledger-apk
          if-no-files-found: error
          retention-days: 30
          path: build/app/outputs/flutter-apk/*.apk
