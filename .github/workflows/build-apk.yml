name: Build APK

# 用途：本机没装 Flutter / Android SDK 时，把项目推到 GitHub，
# 由 Actions 免费构建出可安装的 APK，从 Artifacts 下载即可。
#
# 触发方式：
#   - 手动：仓库页面 → Actions → Build APK → Run workflow
#   - 自动：推送到 main 分支

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # JDK 17：AGP 8.7.3 的硬性要求
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Flutter 版本与工程的 Gradle 8.9 / AGP 8.7.3 / Kotlin 2.0.21 对齐。
      # 若要升到更新的 stable，请同步把 android/app/build.gradle.kts 的
      # compileSdk 提到新插件要求的级别（多数插件从 compileSdk 36 起）。
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.27.4"
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      # 静态检查只做提示，不阻断出包（避免小警告卡住安装包）
      - name: Analyze (non-blocking)
        run: flutter analyze
        continue-on-error: true

      # 通用包：任何机型都能装，体积略大（推荐个人直装用这个）
      - name: Build universal APK
        run: flutter build apk --release

      # 分 ABI 包：每台设备只带自己那份 so，体积约 −40%
      - name: Build split-per-ABI APKs
        run: flutter build apk --release --split-per-abi

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: ledger-apk
          if-no-files-found: error
          retention-days: 30
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/app-x86_64-release.apk
