name: Build APK

# 用途：本机没装 Flutter / Android SDK 时，把项目推到 GitHub，
# 由 Actions 免费构建出可安装的 APK，从 Artifacts 下载即可。
#
# 触发方式：
#   - 手动：仓库页面 → Actions → Build APK → Run workflow
#   - 自动：推送到 main 或 master 分支

on:
  workflow_dispatch:
  push:
    branches: [main, master]

# 可选签名密钥（不配也能出包，只是回退 debug 签名）。
# 配置位置：仓库 Settings → Secrets and variables → Actions → New repository secret
#   KEYSTORE_BASE64     jks 文件的 base64
#                       PowerShell: [Convert]::ToBase64String([IO.File]::ReadAllBytes("ledger-release.jks"))
#   KEYSTORE_PASSWORD   库密码
#   KEY_PASSWORD        密钥密码
#   KEY_ALIAS           密钥别名（如 ledger）
# 四个都配齐才启用正式签名。
env:
  KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
  KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
  KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
  KEY_ALIAS: ${{ secrets.KEY_ALIAS }}

jobs:
  build:
    # 固定到 24.04：ubuntu-latest 会在 2026-10-19 迁到 Ubuntu 26，
    # 固定版本可避免"某天突然换系统"导致的构建漂移。
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # JDK 17：AGP 8.7.3 的硬性要求（同时提供 keytool）
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # ⚠️ 关键一步，别删。
      # Windows 上 git 的 core.fileMode=false，不跟踪文件权限位，所以
      # gradlew 提交时是 100644（不可执行）。Linux runner 检出后调 ./gradlew
      # 会直接 Permission denied → "Process completed with exit code 1"。
      # 仓库里的 index 已修正为 100755；这里再兜一道，防止权限位再次丢失。
      - name: Ensure gradlew is executable
        run: chmod +x android/gradlew

      # 有密钥则落盘 android/key.properties + android/app/ledger-release.jks，
      # build.gradle.kts 检测到 key.properties 即自动启用 release 签名。
      - name: Configure release signing (optional)
        if: env.KEYSTORE_BASE64 != ''
        shell: bash
        run: |
          set -euo pipefail
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/ledger-release.jks
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=ledger-release.jks
          EOF
          echo "已启用 release 签名"

      - name: Warn on debug signing fallback
        if: env.KEYSTORE_BASE64 == ''
        run: echo "::warning::未配置 KEYSTORE_BASE64，本次产物为 debug 签名（可安装；但换签名后需先卸载）"

      # Flutter 版本与工程的 Gradle 8.9 / AGP 8.7.3 / Kotlin 2.0.21 对齐。
      # 若要升到更新的 stable，请同步把 android/app/build.gradle.kts 的
      # compileSdk 提到新插件要求的级别（多数插件从 compileSdk 36 起）。
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.27.4"
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      # 静态检查只做提示，不阻断出包（避免小警告卡住安装包）
      - name: Analyze (non-blocking)
        run: flutter analyze
        continue-on-error: true

      # 通用包：任何机型都能装，体积略大（推荐个人直装用这个）
      # tee 把日志留到文件，供下面的失败诊断步骤使用
      - name: Build universal APK
        shell: bash
        run: |
          set -o pipefail
          flutter build apk --release 2>&1 | tee "$RUNNER_TEMP/build.log"

      # 构建失败时把日志尾部转成 annotation。
      # 为什么要这么绕：Actions 的原始日志下载接口需要鉴权，
      # 而 annotation 可通过公开 API 免鉴权读取 —— 这样报错能被外部直接看到，
      # 不用手动截图/贴日志。annotation 有长度上限，只截最后 45 行。
      - name: Surface build error as annotation
        if: failure()
        shell: bash
        run: |
          f="$RUNNER_TEMP/build.log"
          [ -f "$f" ] || exit 0
          # 先把 % 转义成 %25，再用 awk 把换行换成字面量 %0A（printf 不带 \n）。
          # 必须压成「一行」—— workflow command 是按行解析的，
          # 多行的话第二行起不会被当成注解内容。
          msg=$(tail -45 "$f" | tr -d '\r' | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=Build failed (last 45 lines)::$msg"

      # 分 ABI 包：每台设备只带自己那份 so，体积约 −40%
      - name: Build split-per-ABI APKs
        run: flutter build apk --release --split-per-abi

      - name: Upload APKs
        uses: actions/upload-artifact@v5
        with:
          name: ledger-apk
          if-no-files-found: error
          retention-days: 30
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/app-x86_64-release.apk
